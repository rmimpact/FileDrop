name: Build FileDrop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "filedrop-v*"

permissions:
  contents: write

jobs:
  build-installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # Serial builds avoid two jobs trying to create the same release at once.
      max-parallel: 1
      matrix:
        include:
          - name: macOS universal DMG
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            # The app bundle is required for Tauri's signed .app.tar.gz updater;
            # the DMG remains the friendly installer for first-time downloads.
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows x64 setup executable
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out FileDrop
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Add TAURI_SIGNING_PRIVATE_KEY under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/filedrop-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/filedrop-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          CERTIFICATE_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)

          if [ -z "$CERTIFICATE_IDENTITY" ]; then
            echo "No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERTIFICATE_IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed and notarized Mac installer and add it to the release
        if: runner.os == 'macOS'
        id: build-macos
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: filedrop-v__VERSION__
          releaseName: FileDrop v__VERSION__
          releaseBody: |
            Download the installer for your operating system:

            - macOS: open the DMG and drag FileDrop to Applications.
            - Windows: run the setup EXE. It checks for WebView2 and installs it if needed.

            The macOS installer is signed with Apple Developer ID and notarized by Apple.
            The Windows installer is not yet commercially code-signed, so Windows SmartScreen may ask you to confirm that you want to run FileDrop.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Add permanent Mac download link
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          INSTALLER="$(find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f | head -n 1)"
          ALIAS="$RUNNER_TEMP/FileDrop-macOS.dmg"
          cp "$INSTALLER" "$ALIAS"
          gh release upload "filedrop-v$VERSION" "$ALIAS" --clobber

      - name: Build Windows installer and add it to the release
        if: runner.os == 'Windows'
        id: build-windows
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: filedrop-v__VERSION__
          releaseName: FileDrop v__VERSION__
          releaseBody: |
            Download the installer for your operating system:

            - macOS: open the DMG and drag FileDrop to Applications.
            - Windows: run the setup EXE. It checks for WebView2 and installs it if needed.

            The macOS installer is signed with Apple Developer ID and notarized by Apple.
            The Windows installer is not yet commercially code-signed, so Windows SmartScreen may ask you to confirm that you want to run FileDrop.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Add permanent Windows download link
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Version = node -p "require('./src-tauri/tauri.conf.json').version"
          $Installer = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          $Alias = Join-Path $env:RUNNER_TEMP "FileDrop-Windows-x64-Setup.exe"
          Copy-Item $Installer.FullName $Alias
          gh release upload "filedrop-v$Version" $Alias --clobber

  publish-update-manifest:
    name: Publish combined update manifest
    needs: build-installers
    runs-on: ubuntu-latest

    steps:
      - name: Check out FileDrop
        uses: actions/checkout@v4

      - name: Download updater signatures and release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          RELEASE_TAG="filedrop-v$VERSION"
          mkdir -p updater-signatures
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir updater-signatures
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json

      - name: Create and publish complete latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          RELEASE_TAG="filedrop-v$VERSION"
          node scripts/create-update-manifest.mjs "$VERSION" release.json updater-signatures latest.json
          gh release upload "$RELEASE_TAG" latest.json --clobber
